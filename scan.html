<!DOCTYPE html>
<html lang="th">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>KRAM AI | สแกนใบคราม</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>

</head>


<body>

<main class="chat-page">

    <div class="chat-container">


        <!-- HEADER -->

        <div class="chat-header">

            <div class="chat-logo">
                🌿
            </div>

            <div>

                <h1>KRAM AI</h1>

                <p>
                    AI วิเคราะห์ใบคราม
                </p>

            </div>

        </div>


        <!-- SCANNER -->

        <div
            style="
                text-align:center;
                padding:20px;
            "
        >

            <h2>
                📷 สแกนใบคราม
            </h2>

            <p>
                ใช้กล้องหลังของโทรศัพท์
                เพื่อวิเคราะห์ใบคราม
            </p>


            <!-- CAMERA -->

            <div
                id="camera-container"
                style="
                    width:100%;
                    max-width:400px;
                    margin:20px auto;
                    display:flex;
                    justify-content:center;
                    align-items:center;
                    background:#111;
                    border-radius:18px;
                    overflow:hidden;
                    min-height:300px;
                "
            >

                <video
                    id="camera"
                    autoplay
                    playsinline
                    style="
                        width:100%;
                        max-width:400px;
                        display:none;
                    "
                ></video>

            </div>


            <!-- START -->

            <button
                id="startButton"
                onclick="startCamera()"
                class="kram-button scan-button"
            >
                📷 เปิดกล้อง
            </button>


            <!-- SWITCH CAMERA -->

            <button
                id="switchButton"
                onclick="switchCamera()"
                class="kram-button"
                style="
                    display:none;
                    background:
                    linear-gradient(
                        135deg,
                        #555,
                        #333
                    );
                "
            >
                🔄 สลับกล้อง
            </button>


            <!-- RESULT -->

            <div
                id="result"
                style="
                    font-size:20px;
                    font-weight:bold;
                    margin:25px 0;
                "
            >
                รอการสแกน...
            </div>


            <!-- CLASS RESULT -->

            <div
                id="label-container"
                style="
                    font-size:16px;
                "
            ></div>


            <!-- CHAT -->

            <button
                onclick="location.href='chat.html'"
                class="kram-button chat-button"
            >
                🤖 ถาม KRAM AI
            </button>


            <br>


            <a
                href="index.html"
                class="back-home"
            >
                ← กลับหน้าหลัก
            </a>

        </div>

    </div>

</main>


<script>

    // =========================================
    // KRAM AI CAMERA
    // =========================================


    const MODEL_URL = "./my_model/";


    let model;

    let video =
        document.getElementById("camera");

    let stream = null;

    let currentFacingMode = "environment";

    let isRunning = false;


    // =========================================
    // โหลด AI
    // =========================================

    async function loadAI() {

        const modelURL =
            MODEL_URL + "model.json";

        const metadataURL =
            MODEL_URL + "metadata.json";


        model =
            await tmImage.load(
                modelURL,
                metadataURL
            );

    }


    // =========================================
    // เปิดกล้อง
    // =========================================

    async function startCamera() {

        try {

            document
                .getElementById("result")
                .innerHTML =
                "⏳ กำลังเตรียม AI...";


            if (!model) {

                await loadAI();

            }


            await openCamera();


            document
                .getElementById("startButton")
                .style.display =
                "none";


            document
                .getElementById("switchButton")
                .style.display =
                "flex";


            video.style.display =
                "block";


            isRunning = true;


            predict();


        }

        catch (error) {

            console.error(error);


            document
                .getElementById("result")
                .innerHTML =

                "❌ ไม่สามารถเปิดกล้องได้" +

                "<br><br>" +

                "<small>" +

                "กรุณาอนุญาตให้เว็บไซต์ใช้กล้อง" +

                "</small>";

        }

    }


    // =========================================
    // เปิดกล้องตาม facingMode
    // =========================================

    async function openCamera() {

        // ปิดกล้องเดิมก่อน

        if (stream) {

            stream
                .getTracks()
                .forEach(
                    track =>
                    track.stop()
                );

        }


        stream =
            await navigator.mediaDevices
                .getUserMedia({

                    video: {

                        facingMode:
                            {
                                ideal:
                                currentFacingMode
                            }

                    },

                    audio: false

                });


        video.srcObject =
            stream;


        await video.play();


        document
            .getElementById("result")
            .innerHTML =
            "📷 กำลังวิเคราะห์ใบคราม...";

    }


    // =========================================
    // สลับกล้อง
    // =========================================

    async function switchCamera() {

        if (
            currentFacingMode ===
            "environment"
        ) {

            currentFacingMode =
                "user";

        }

        else {

            currentFacingMode =
                "environment";

        }


        document
            .getElementById("result")
            .innerHTML =
            "🔄 กำลังเปลี่ยนกล้อง...";


        try {

            await openCamera();

        }

        catch (error) {

            console.error(error);

            document
                .getElementById("result")
                .innerHTML =
                "❌ ไม่สามารถเปลี่ยนกล้องได้";

        }

    }


    // =========================================
    // วิเคราะห์ภาพ
    // =========================================

    async function predict() {

        if (!isRunning) {

            return;

        }


        if (
            video.readyState <
            2
        ) {

            requestAnimationFrame(
                predict
            );

            return;

        }


        try {

            const prediction =
                await model.predict(
                    video
                );


            let highest =
                prediction[0];


            for (
                let i = 1;
                i < prediction.length;
                i++
            ) {

                if (
                    prediction[i]
                        .probability
                    >
                    highest.probability
                ) {

                    highest =
                        prediction[i];

                }

            }


            const className =
                highest.className;


            const confidence =
                (
                    highest.probability *
                    100
                ).toFixed(0);


            document
                .getElementById("result")
                .innerHTML = `

                    🌿 ตรวจพบ:
                    <strong>
                    ${className}
                    </strong>

                    <br><br>

                    🎯 ความมั่นใจ:
                    <strong>
                    ${confidence}%
                    </strong>

                `;


        }

        catch (error) {

            console.error(error);

        }


        requestAnimationFrame(
            predict
        );

    }


    // =========================================
    // ปิดกล้องเมื่อออกจากหน้า
    // =========================================

    window.addEventListener(
        "beforeunload",
        function() {

            if (stream) {

                stream
                    .getTracks()
                    .forEach(
                        track =>
                        track.stop()
                    );

            }

        }
    );

</script>


</body>

</html>
