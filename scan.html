
<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="theme-color" content="#ffffff">

    <title>GARDEN AI | สแกนพรรณไม้</title>

    <link rel="stylesheet" href="style.css">

    <!-- TensorFlow.js -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>

    <!-- Teachable Machine -->
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>

</head>

<body>

    <main class="chat-page">

        <div class="chat-container">

            <!-- HEADER -->
            <div class="chat-header">

                <div class="chat-logo">
                    🌿
                </div>

                <div>
                    <h1>GARDEN AI</h1>
                    <p>AI วิเคราะห์พรรณไม้</p>
                </div>

            </div>

            <!-- SCANNER -->
            <div style="text-align:center; padding:20px;">

                <h2>📷 สแกนพรรณไม้</h2>

                <p>
                    ใช้กล้องมือถือส่องพรรณไม้
                    เพื่อให้ AI วิเคราะห์
                </p>

                <!-- START CAMERA -->
                <button
                    id="startButton"
                    type="button"
                    onclick="init()"
                    style="
                        padding:14px 25px;
                        font-size:18px;
                        border:none;
                        border-radius:12px;
                        cursor:pointer;
                    "
                >
                    📷 เปิดกล้อง
                </button>

                <!-- CAMERA -->
                <div
                    id="webcam-container"
                    style="
                        margin:20px auto;
                        display:flex;
                        justify-content:center;
                        max-width:100%;
                    "
                ></div>

                <!-- RESULT -->
                <div
                    id="result"
                    style="
                        font-size:20px;
                        font-weight:bold;
                        margin:20px 0;
                    "
                >
                    รอการสแกน...
                </div>

                <!-- ALL PREDICTIONS -->
                <div id="label-container"></div>

                <!-- CHAT BUTTON -->
                <button
                    type="button"
                    onclick="location.href='chat.html'"
                    style="
                        margin-top:20px;
                        padding:12px 20px;
                        font-size:16px;
                        border:none;
                        border-radius:10px;
                        cursor:pointer;
                    "
                >
                    🤖 ถาม GARDEN AI
                </button>

                <br><br>

                <a href="index.html">
                    ← กลับหน้าหลัก
                </a>

            </div>

        </div>

    </main>


    <script>

        // ========================================
        // GARDEN AI - SMART PLANT SCANNER
        // ========================================

        // URL ของโมเดล Teachable Machine
        const MODEL_URL = "./my_model/";

        let model = null;
        let webcam = null;
        let isRunning = false;
        let isLoading = false;

        const result =
            document.getElementById("result");

        const startButton =
            document.getElementById("startButton");

        const webcamContainer =
            document.getElementById("webcam-container");

        const labelContainer =
            document.getElementById("label-container");


        // ========================================
        // แสดงข้อความ
        // ========================================

        function showMessage(message) {

            result.textContent = message;

        }


        // ========================================
        // จัดการข้อผิดพลาด
        // ========================================

        function showError(error, type) {

            console.error(type + ":", error);

            let message = "เกิดข้อผิดพลาด กรุณาลองใหม่";

            if (error.name === "NotAllowedError") {

                message =
                    "กรุณาอนุญาตให้เว็บไซต์เข้าถึงกล้อง";

            }

            else if (error.name === "NotFoundError") {

                message =
                    "ไม่พบกล้องในอุปกรณ์";

            }

            else if (error.name === "NotReadableError") {

                message =
                    "กล้องกำลังถูกใช้งานโดยแอปอื่น";

            }

            else if (error.name === "SecurityError") {

                message =
                    "เว็บไซต์ไม่มีสิทธิ์เข้าถึงกล้อง";

            }

            else if (error.name === "OverconstrainedError") {

                message =
                    "ไม่สามารถใช้การตั้งค่ากล้องนี้ได้";

            }

            else if (type === "MODEL ERROR") {

                message =
                    "โหลดโมเดล AI ไม่สำเร็จ กรุณาตรวจสอบไฟล์ my_model";

            }

            showMessage("❌ " + message);

        }


        // ========================================
        // หยุดกล้อง
        // ========================================

        function stopCamera() {

            isRunning = false;

            if (webcam) {

                try {

                    webcam.stop();

                } catch (error) {

                    console.warn(
                        "Camera stop:",
                        error
                    );

                }

                webcam = null;

            }

            webcamContainer.innerHTML = "";

            labelContainer.innerHTML = "";

        }


        // ========================================
        // เปิดกล้องและเริ่ม AI
        // ========================================

        async function init() {

            if (isLoading || isRunning) {
                return;
            }

            isLoading = true;

            startButton.disabled = true;

            startButton.textContent =
                "⏳ กำลังเริ่มระบบ...";

            showMessage("🔍 กำลังตรวจสอบระบบ...");

            labelContainer.innerHTML = "";

            // ตรวจสอบ HTTPS และสิทธิ์การใช้กล้อง

            if (
                !window.isSecureContext ||
                !navigator.mediaDevices ||
                !navigator.mediaDevices.getUserMedia
            ) {

                showMessage(
                    "❌ กรุณาเปิดเว็บไซต์ผ่าน HTTPS หรือ localhost"
                );

                startButton.disabled = false;

                startButton.textContent =
                    "📷 เปิดกล้อง";

                isLoading = false;

                return;

            }


            // ตรวจสอบ Teachable Machine

            if (typeof tmImage === "undefined") {

                showMessage(
                    "❌ โหลด Teachable Machine ไม่สำเร็จ กรุณาตรวจสอบอินเทอร์เน็ต"
                );

                startButton.disabled = false;

                startButton.textContent =
                    "📷 เปิดกล้อง";

                isLoading = false;

                return;

            }


            // ========================================
            // 1. เปิดกล้อง
            // ========================================

            try {

                showMessage(
                    "📷 กำลังขออนุญาตเปิดกล้อง..."
                );

                webcam = new tmImage.Webcam(
                    300,
                    300,
                    true
                );

                await webcam.setup();

                await webcam.play();

                webcamContainer.innerHTML = "";

                webcamContainer.appendChild(
                    webcam.canvas
                );

                isRunning = true;

            }

            catch (error) {

                showError(error, "CAMERA ERROR");

                stopCamera();

                startButton.disabled = false;

                startButton.textContent =
                    "📷 เปิดกล้อง";

                isLoading = false;

                return;

            }


            // ========================================
            // 2. โหลดโมเดล AI
            // ========================================

            try {

                showMessage(
                    "🤖 กำลังโหลดโมเดล AI..."
                );

                const modelURL =
                    MODEL_URL + "model.json";

                const metadataURL =
                    MODEL_URL + "metadata.json";

                model = await tmImage.load(
                    modelURL,
                    metadataURL
                );

                if (
                    !model ||
                    model.getTotalClasses() === 0
                ) {

                    throw new Error(
                        "ไม่พบคลาสในโมเดล"
                    );

                }

            }

            catch (error) {

                showError(error, "MODEL ERROR");

                stopCamera();

                startButton.disabled = false;

                startButton.textContent =
                    "📷 เปิดกล้องอีกครั้ง";

                isLoading = false;

                return;

            }


            // ========================================
            // 3. เริ่มวิเคราะห์
            // ========================================

            isLoading = false;

            startButton.style.display = "none";

            showMessage(
                "🌿 กำลังวิเคราะห์พรรณไม้..."
            );

            window.requestAnimationFrame(loop);

        }


        // ========================================
        // LOOP
        // ========================================

        async function loop() {

            if (!isRunning || !webcam || !model) {
                return;
            }

            try {

                webcam.update();

                await predict();

            }

            catch (error) {

                console.error(
                    "Prediction Error:",
                    error
                );

                showMessage(
                    "❌ เกิดข้อผิดพลาดในการวิเคราะห์"
                );

                stopCamera();

                startButton.style.display = "inline-block";

                startButton.disabled = false;

                startButton.textContent =
                    "📷 เปิดกล้องอีกครั้ง";

                return;

            }

            if (isRunning) {

                window.requestAnimationFrame(loop);

            }

        }


        // ========================================
        // AI PREDICTION
        // ========================================

        async function predict() {

            const prediction =
                await model.predict(
                    webcam.canvas
                );

            if (
                !prediction ||
                prediction.length === 0
            ) {

                throw new Error(
                    "ไม่พบผลการวิเคราะห์"
                );

            }

            // เรียงผลจากความมั่นใจมากไปน้อย

            const sortedPrediction =
                [...prediction].sort(
                    (a, b) =>
                        b.probability - a.probability
                );

            const highest =
                sortedPrediction[0];

            const className =
                highest.className;

            const confidence =
                (highest.probability * 100)
                .toFixed(1);


            // ========================================
            // แสดงผลลัพธ์หลัก
            // ========================================

            result.innerHTML = "";

            const title =
                document.createElement("div");

            title.textContent =
                "🌿 ตรวจพบ: " + className;

            const score =
                document.createElement("div");

            score.style.marginTop = "12px";

            score.textContent =
                "🎯 ความมั่นใจ: " + confidence + "%";

            result.appendChild(title);

            result.appendChild(score);


            // ========================================
            // แสดงคะแนนทุกประเภท
            // ========================================

            labelContainer.innerHTML = "";

            sortedPrediction.forEach(item => {

                const percentage =
                    (item.probability * 100)
                    .toFixed(1);

                const line =
                    document.createElement("p");

                line.textContent =
                    item.className + ": " +
                    percentage + "%";

                labelContainer.appendChild(line);

            });

        }


        // ========================================
        // ปิดกล้องเมื่อออกจากหน้า
        // ========================================

        window.addEventListener(
            "pagehide",
            stopCamera
        );

    </script>

</body>
</html>
